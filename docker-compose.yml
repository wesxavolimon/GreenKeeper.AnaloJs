services:
  app:
    build: .
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - VITE_APP_ENV=development

  test:
    build: .
    command: npm run test:coverage
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - VITE_APP_ENV=test

  build:
    build: .
    command: npm run build
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - VITE_APP_ENV=production

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app
    command: sh -c "npm ci && VITE_APP_ENV=production npm run build && npx playwright test"
    ipc: host
    volumes:
      - .:/app
      - playwright_node_modules:/app/node_modules

volumes:
  node_modules:
  playwright_node_modules:
