[build]
  command = "npm run build"
  publish = "dist/analog/public"

[build.environment]
  NODE_VERSION = "22"
  VITE_APP_ENV = "production"

# Fallback de SPA (rotas do Angular)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
